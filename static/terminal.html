<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173d36"><title>Перекличка · Камера</title><link rel="stylesheet" href="/static/style.css"><script src="/static/terminal.js" defer></script></head><body class="terminal-body"><main class="terminal-shell"><header class="terminal-header"><a class="brand" href="/terminal"><span class="brand-icon">п</span> перекличка</a><span id="networkState" class="badge neutral">Подключение…</span></header><section class="terminal-intro"><p class="eyebrow" id="modeLabel">ТЕРМИНАЛ ПОСЕЩАЕМОСТИ</p><h1 id="sessionTitle">Посмотрите в камеру</h1><p id="sessionDescription" class="muted">Люди подходят по одному. Результат появится на экране.</p></section><div class="camera-stage" id="cameraStage"><video id="video" autoplay muted playsinline></video><div class="camera-placeholder" id="cameraPlaceholder"><div class="empty-icon">◎</div><p>Камера готова к включению</p></div><div id="faceBox" class="face-box" hidden></div><div class="viewfinder" id="viewfinder"></div></div><section id="result" class="terminal-result" aria-live="polite"><div class="result-dot"></div><h2 id="resultMessage">Включите камеру для начала</h2><progress id="progress" max="1" value="0" hidden></progress></section><button class="button primary full" id="startCamera">Включить камеру</button><div class="camera-controls" id="cameraControls" hidden><button class="button secondary" id="switchCamera">↻ Другая камера</button><button class="button secondary" id="stopCamera">Выключить</button></div><p class="terminal-footnote">Распознавание выполняется на ноутбуке.<br>Проверка живости в этой версии отключена.</p></main><canvas id="capture" hidden></canvas></body></html>
