[project]
name = "face-attendance"
version = "0.1.0"
description = "Local attendance terminal with an Android camera"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "cryptography>=43",
  "qrcode[pil]>=8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
